# Operation Sentinel: AWS Security Governance Platform

An event-driven AWS security automation platform that detects risky S3 public access changes, restores protective controls, records audit evidence, and validates infrastructure code through CI/CD security scanning.

---

## Problem

Cloud environments move faster than manual security review. A single `DeleteBucketPublicAccessBlock` action can remove critical S3 exposure protections before a security team has time to respond.

For regulated or security-sensitive environments, delayed remediation is not just an operational gap. It creates data exposure risk, weakens audit readiness, and increases the likelihood of policy drift across cloud infrastructure.

## Solution

Operation Sentinel closes that gap with an automated security control loop:

```text
Detect → Remediate → Audit → Alert → Validate
```

The platform detects risky S3 configuration activity through CloudTrail and EventBridge, invokes a Lambda responder, restores S3 Block Public Access, records structured evidence in DynamoDB, sends an SNS notification, and surfaces remediation activity through CloudWatch.

The infrastructure is deployed with Terraform and validated through GitHub Actions and Trivy before changes are merged.

